name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bicep-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy shared
        run: >
          az deployment sub create
          --name shared-${{ github.run_number }}
          --location uksouth
          --parameters shared.bicepparam

      - name: Deploy Rental Manager
        run: >
          az deployment sub create
          --name rentalmgr-${{ github.run_number }}
          --location uksouth
          --parameters rentalmgr.bicepparam