name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  bicep-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: shared Bicep build
        run: az bicep build --file shared.bicep
      - name: Bicep build
        run: az bicep build --file rentalmgr.bicep